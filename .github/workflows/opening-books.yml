name: Separate opening book download
on:
  workflow_dispatch:
  push:
    branches: [development/0.3.7]
    paths: [.github/workflows/opening-books.yml]
jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Opening-Books
          path: src/nocturne_battle/books/
