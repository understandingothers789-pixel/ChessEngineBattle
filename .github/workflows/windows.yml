name: Windows desktop validation
on:
  workflow_dispatch:
  push:
    branches: [main, development/0.2.0, development/0.3.0]
  pull_request:
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --clean --noconfirm NocturneBattle.spec
      - name: Packaged Windows startup and render smoke test
        run: python -c "import subprocess; subprocess.run(['dist/NocturneBattle/NocturneBattle.exe', '--smoke-test'], timeout=45, check=True)"
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: NocturneBattle-0.3.1-Windows
          path: dist/NocturneBattle/
