name: Windows desktop validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --clean --noconfirm ChessEngineBattle.spec
      - name: Packaged Windows startup and render smoke test
        run: python -c "import subprocess; subprocess.run(['dist/ChessEngineBattle/ChessEngineBattle.exe', '--smoke-test'], timeout=45, check=True)"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Record build dependencies and signature status
        shell: pwsh
        run: |
          python --version | Out-File dist/ChessEngineBattle/BUILD-INFO.txt
          python -m pip freeze | Out-File -Append dist/ChessEngineBattle/BUILD-INFO.txt
          Get-AuthenticodeSignature dist/ChessEngineBattle/ChessEngineBattle.exe | Select-Object Status, StatusMessage | Format-List | Out-File -Append dist/ChessEngineBattle/BUILD-INFO.txt
          Get-FileHash dist/ChessEngineBattle/ChessEngineBattle.exe -Algorithm SHA256 | Format-List | Out-File -Append dist/ChessEngineBattle/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChessEngineBattle-0.5.2-from-0.5.1-rebuild3-Windows
          path: dist/ChessEngineBattle/
